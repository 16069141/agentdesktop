{
  "appId": "com.private-ai.client",
  "productName": "颤翎子AI助手",
  "directories": {
    "buildResources": "build",
    "output": "../release"
  },
  "files": [
    "dist/**/*",
    "dist-electron/**/*"
  ],
  "extraResources": [
    {
      "from": "build-staging/agent",
      "to": "agent",
      "filter": ["**/*", "!**/data/uploads/**", "!**/data/db/**", "!**/__pycache__/**"]
    },
    {
      "from": "build-staging/config",
      "to": "config",
      "filter": ["**/*"]
    },
    {
      "from": "build-staging/runtime",
      "to": "runtime",
      "filter": ["**/*"]
    }
  ],
  "artifactName": "${productName}-${version}-${arch}.${ext}",
  "asar": true,
  "compression": "maximum",
  "win": {
    "target": [{ "target": "nsis", "arch": ["x64"] }],
    "icon": "build/icon.ico",
    "artifactName": "${productName}-${version}-${arch}.${ext}",
    "signAndEditExecutable": false
  },
  "mac": {
    "target": [{ "target": "dmg" }],
    "icon": "build/icon.icns",
    "category": "public.app-category.productivity",
    "darkModeSupport": true,
    "hardenedRuntime": false,
    "gatekeeperAssess": false,
    "identity": null,
    "extendInfo": {
      "NSHumanReadableCopyright": "内部使用，未经许可请勿传播。",
      "LSMinimumSystemVersion": "11.0"
    }
  },
  "linux": {
    "target": ["AppImage"],
    "icon": "build/icon.png",
    "category": "Utility"
  },
  "nsis": {
    "oneClick": false,
    "perMachine": false,
    "allowToChangeInstallationDirectory": true,
    "installerIcon": "build/icon.ico",
    "uninstallerIcon": "build/icon.ico",
    "createDesktopShortcut": true,
    "createStartMenuShortcut": true,
    "deleteAppDataOnUninstall": false
  },
  "dmg": {
    "title": "${productName} ${version}",
    "iconSize": 96,
    "contents": [
      { "x": 110, "y": 220, "type": "file" },
      { "x": 410, "y": 220, "type": "link", "path": "/Applications" }
    ]
  }
}